# account-service, Spring profile "async-sale" — the LIVE asynchronous SALE flow (ADR-018).
#
# Layered ON TOP of account-service.yml, which is unchanged and still ships every
# messaging switch OFF. Activate with SPRING_PROFILES_ACTIVE=async-sale.
#
# The synchronous POST /api/accounts/{n}/product-involvements is untouched and still
# serves the legacy route. The three consumers below route into the SAME AccountService
# methods, plus the one internal, saga-scoped involvement compensation ADR-018 §7 adds —
# which is a saga command with an ownership guard, and deliberately NOT an endpoint.

spring:
  cloud:
    function:
      # Spring Cloud FUNCTION reads this key — NOT `spring.cloud.stream.function.definition`,
      # which reads naturally next to `stream:` below but is not a real property. Nesting it
      # under `stream:` leaves every function unbound: no consumer group ever forms, commands
      # sit un-consumed, and every saga stalls in AWAITING_ACCOUNT_CHECK until retries exhaust.
      definition: checkSaleAccount;linkSaleProducts;compensateSaleInvolvements
    stream:
      kafka:
        bindings:
          checkSaleAccount-in-0:
            consumer:
              enable-dlq: true
              dlq-name: crm.account.cmd.check-sale-account.v1.dlq
          linkSaleProducts-in-0:
            consumer:
              enable-dlq: true
              dlq-name: crm.account.cmd.link-sale-products.v1.dlq
          compensateSaleInvolvements-in-0:
            consumer:
              enable-dlq: true
              dlq-name: crm.account.cmd.compensate-sale-involvements.v1.dlq
      bindings:
        # max-attempts: 1 — redelivery plus the Inbox guard is the retry policy
        # (ADR-017 §8.3).
        checkSaleAccount-in-0:
          destination: crm.account.cmd.check-sale-account.v1
          group: account-service.crm.account.cmd.check-sale-account.v1
          consumer:
            max-attempts: 1
        linkSaleProducts-in-0:
          destination: crm.account.cmd.link-sale-products.v1
          group: account-service.crm.account.cmd.link-sale-products.v1
          consumer:
            max-attempts: 1
        compensateSaleInvolvements-in-0:
          destination: crm.account.cmd.compensate-sale-involvements.v1
          group: account-service.crm.account.cmd.compensate-sale-involvements.v1
          consumer:
            max-attempts: 1

crm:
  security:
    # ADR-010 addendum (2026-08-13): the check/link/compensate saga commands above
    # run on a Kafka listener thread, not inside an HTTP request, so there is no
    # user token for the customer-service/lookup-service RestClients to propagate.
    # This client-credentials identity is the fallback BearerTokenPropagationInterceptor
    # reaches for when SecurityContextHolder has no JwtAuthenticationToken — every
    # request-bound call ADR-010 already documents is completely unaffected. The
    # secret is local-dev seed data (infra/keycloak/realm/crm-lite-realm.json), the
    # same as this realm's other seeded credentials — never a real one.
    service-account:
      client-id: crm-saga-worker
      client-secret: crm-saga-worker-dev-secret
      # Compose-internal, same reasoning as CRM_SECURITY_JWKSETURI in docker-compose.yml
      # (ADR-006): the canonical issuer is not reachable from inside this container.
      token-uri: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/token
  messaging:
    broker:
      enabled: true
    outbox:
      # Required: the saga's reply events are recorded here. An account-service with the
      # outbox off would consume commands and answer nothing, stalling every sale at its
      # first step.
      enabled: true
      relay:
        # In-process relay. Mutually exclusive with Debezium (ADR-017 §9.3).
        enabled: true
