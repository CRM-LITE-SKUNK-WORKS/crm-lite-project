server:
  port: 8080
  # The frontend container (FE-ADR-004/010) serves the SPA on :4200 and reverse-
  # proxies /api, /oauth2, /login and /logout to this gateway, so the browser only
  # ever talks to one origin. For that to hold through the OAuth2 dance, the gateway
  # must build its redirect_uri from the ORIGIN THE BROWSER USED, not from the
  # internal request it receives. `framework` makes Spring honour the X-Forwarded-*
  # headers nginx sets, so {baseUrl} resolves to http://localhost:4200 for requests
  # arriving through the frontend and stays http://localhost:8080 for direct hits
  # (Swagger UI, Postman, curl) — both are registered on the crm-bff client, and
  # Keycloak's registered-URI list remains the security backstop for any other value.
  # customer-service and lookup-service already set this for the same class of reason.
  forward-headers-strategy: framework
  servlet:
    session:
      # KR-9 idle timeout: mirrors Keycloak's SSO Session Idle (30m). The absolute
      # 24h cap (KR-9) is enforced by Keycloak's SSO Session Max: once it is
      # reached, token refresh fails and the user must log in again.
      timeout: ${crm.security.session-idle:30m}
      cookie:
        http-only: true
        # Lax (not Strict): the OAuth2 callback redirect from Keycloak is a
        # top-level cross-site GET and must carry the session cookie.
        same-site: lax
        # Local dev runs plain http; MUST be true in any non-local environment.
        secure: ${crm.security.cookie-secure:false}

crm:
  security:
    keycloak:
      # Browser-facing base URL — the canonical issuer host (pinned via KC_HOSTNAME
      # in compose, so the JWT `iss` claim always matches this value).
      base-url: http://localhost:8180
      # Server-to-server base URL (token endpoint, JWKS). Same as base-url when the
      # gateway runs on the host (IDE); overridden to http://keycloak:8180 in the
      # compose network via CRM_SECURITY_KEYCLOAK_INTERNALBASEURL.
      internal-base-url: http://localhost:8180
      realm: crm-lite

spring:
  # 3b) Global HTTP client timeouts.
  # WebMVC gateway uses Spring Boot's HTTP client settings (spring.http.client.*),
  # NOT the WebFlux-only spring.cloud.gateway.httpclient.* properties.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: crm-bff
            # Public client + PKCE (ADR-006): no client secret exists anywhere in
            # this repository. client-authentication-method 'none' makes Spring
            # Security attach a PKCE code_challenge automatically.
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          keycloak:
            # Endpoints are configured explicitly, and issuer-uri is deliberately NOT
            # set, so Spring Boot performs NO OIDC discovery at startup. This matters
            # for two reasons (ADR-006 §issuer):
            #   1. The gateway must not hard-depend on Keycloak being reachable before
            #      it can start.
            #   2. Browser-facing and server-to-server URLs differ. Keycloak pins the
            #      issuer to the browser-facing http://localhost:8180 (KC_HOSTNAME), which
            #      is unreachable from inside the compose network. Setting issuer-uri would
            #      force Spring Boot to fetch .well-known/openid-configuration from that
            #      browser-facing host at startup and the container would fail to boot.
            # Endpoint split:
            #   - authorization endpoint -> browser-facing base (localhost:8180)
            #   - token/JWKS/userinfo    -> internal base (keycloak:8180 in compose)
            # The ID token's signature is still verified via jwk-set-uri; the access-token
            # issuer that domain services enforce (ADR-009) is unaffected by this file.
            authorization-uri: ${crm.security.keycloak.base-url}/realms/${crm.security.keycloak.realm}/protocol/openid-connect/auth
            token-uri: ${crm.security.keycloak.internal-base-url}/realms/${crm.security.keycloak.realm}/protocol/openid-connect/token
            jwk-set-uri: ${crm.security.keycloak.internal-base-url}/realms/${crm.security.keycloak.realm}/protocol/openid-connect/certs
            user-info-uri: ${crm.security.keycloak.internal-base-url}/realms/${crm.security.keycloak.realm}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

  # 2b) Route definitions. Correct prefix for the WebMVC gateway is
  # spring.cloud.gateway.server.webmvc.routes (NOT the WebFlux spring.cloud.gateway.routes).
  # TokenRelay (ADR-007): swaps the session for the user's Keycloak access token so
  # domain services only ever see Authorization: Bearer. RemoveRequestHeader=Cookie:
  # browser cookies never leave the BFF edge (binding: services do not see cookies).
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie
            # City/district reference data is owned by customer-service (local tables).
            - id: customer-service-cities
              uri: lb://customer-service
              predicates:
                - Path=/api/cities/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie
            # Shared GNL_ST/GNL_TP catalogs (ADR-002) — exposed for frontend dropdowns.
            - id: lookup-service
              uri: lb://lookup-service
              predicates:
                - Path=/api/lookups/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie
            # Billing accounts (FR-ACCT-01..04, ADR-013). Same BFF contract as the other
            # domain routes: session swapped for the user's Bearer token, cookies never
            # leave the edge. The /api/accounts/** prefix overlaps no other route.
            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie
            # Product viewing (FR-PROD-01..02) + read-only offer/campaign catalog.
            # Same BFF contract as the other domain routes. NOTE: account-service's
            # internal /api/accounts/{n}/product-ids endpoint is matched by the
            # accounts route above — acceptable: it serves only ids and requires the
            # same crm-user JWT; the primary consumer (product-service) calls it
            # directly via Eureka, never through the gateway (ADR-010).
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie
            - id: product-service-offers
              uri: lb://product-service
              predicates:
                - Path=/api/offers/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie
            - id: product-service-campaigns
              uri: lb://product-service
              predicates:
                - Path=/api/campaigns/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie
            # Product sale / orders (FR-SALE-01..02, ADR-016). Same BFF contract.
            # NOTE, as with product-ids above: product-service's internal write
            # commands (POST /api/products, /confirm, /cancel) are matched by the
            # products route — acceptable for the same reason, they require the same
            # crm-user JWT, and order-service calls them directly via Eureka rather
            # than through the gateway (ADR-010). The same applies to
            # account-service's POST /api/accounts/{n}/product-involvements.
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - TokenRelay=
                - RemoveRequestHeader=Cookie
            # Unified Swagger UI (ADR-012): proxy each service's OpenAPI JSON under this
            # gateway's own origin so springdoc.swagger-ui.urls below can list them. Both
            # services permit /v3/api-docs anonymously (crm.security.permit-paths), so no
            # TokenRelay is needed here — it's schema metadata, not business data.
            # X-Forwarded-Host/Proto are set explicitly (not assumed from a gateway
            # default): springdoc reads these itself to build the OpenAPI "servers" URL
            # used by "Try it out" — without them it self-reports its own container
            # hostname:port, which the browser cannot reach (ADR-009).
            - id: customer-service-docs
              uri: lb://customer-service
              predicates:
                - Path=/v3/api-docs/customer-service
              filters:
                - RewritePath=/v3/api-docs/customer-service, /v3/api-docs
                - AddRequestHeader=X-Forwarded-Host, localhost:8080
                - AddRequestHeader=X-Forwarded-Proto, http
            - id: lookup-service-docs
              uri: lb://lookup-service
              predicates:
                - Path=/v3/api-docs/lookup-service
              filters:
                - RewritePath=/v3/api-docs/lookup-service, /v3/api-docs
                - AddRequestHeader=X-Forwarded-Host, localhost:8080
                - AddRequestHeader=X-Forwarded-Proto, http
            - id: account-service-docs
              uri: lb://account-service
              predicates:
                - Path=/v3/api-docs/account-service
              filters:
                - RewritePath=/v3/api-docs/account-service, /v3/api-docs
                - AddRequestHeader=X-Forwarded-Host, localhost:8080
                - AddRequestHeader=X-Forwarded-Proto, http
            - id: product-service-docs
              uri: lb://product-service
              predicates:
                - Path=/v3/api-docs/product-service
              filters:
                - RewritePath=/v3/api-docs/product-service, /v3/api-docs
                - AddRequestHeader=X-Forwarded-Host, localhost:8080
                - AddRequestHeader=X-Forwarded-Proto, http
            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/v3/api-docs/order-service
              filters:
                - RewritePath=/v3/api-docs/order-service, /v3/api-docs
                - AddRequestHeader=X-Forwarded-Host, localhost:8080
                - AddRequestHeader=X-Forwarded-Proto, http

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  # 3a) Register with a routable IP and a unique id so this works in containers
  # and when more than one instance runs.
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# Unified Swagger UI (ADR-012): one page at /swagger-ui.html with a service dropdown,
# backed by the /v3/api-docs/* proxy routes above. Domain services only generate the
# JSON (springdoc.swagger-ui.enabled=false there); this is the only UI in the platform.
springdoc:
  swagger-ui:
    urls:
      - name: customer-service
        url: /v3/api-docs/customer-service
      - name: lookup-service
        url: /v3/api-docs/lookup-service
      - name: account-service
        url: /v3/api-docs/account-service
      - name: product-service
        url: /v3/api-docs/product-service
      - name: order-service
        url: /v3/api-docs/order-service

# 2c) Actuator exposure.
# NOTE: /actuator/gateway/routes is a WebFlux-only endpoint; the WebMVC gateway
# does not provide it. In WebMVC, routes are registered as RouterFunction beans,
# so they show up under /actuator/mappings instead.
# Security hardening (ADR-009): only health stays anonymous; info/mappings/prometheus
# require an authenticated crm-user session (see SecurityConfig) — deliberately NOT
# added to the permitAll list like the other services' /actuator/prometheus, because
# this is the one deployable with a HOST-PUBLISHED port (8080): permitting it here
# would put JVM/HTTP metrics on the public internet edge, not just "internal". The
# Prometheus scrape config (infra/observability/prometheus.yml) therefore does not
# target api-gateway; wiring a dedicated internal-only management port is left as
# documented follow-up (docs/runbooks/observability.md) rather than risking this
# gateway's carefully-tuned security chain in this change.
management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,prometheus
