server:
  port: 8082
  # Swagger UI "Try it out" is executed by the browser against whatever server URL
  # springdoc auto-detects from the incoming request. Without this, that's the raw
  # request as customer-service itself sees it (the gateway's proxied call), i.e. this
  # container's own hostname:port — unreachable from the browser (ADR-009: no
  # published host port). `framework` makes Spring honor the X-Forwarded-* headers
  # Spring Cloud Gateway already sends, so the detected server becomes the gateway's
  # public origin (localhost:8080) instead (ADR-012).
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/customer_db
    username: crmlite
    password: crmlite
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Outbound integration boundaries. Base URLs use Eureka service names resolved by the
# load-balanced RestClient; override with concrete http://host:port when running
# without discovery.
crm:
  security:
    # Canonical issuer (ADR-006): must equal the JWT `iss` claim exactly. Keycloak's
    # KC_HOSTNAME pins tokens to this value in every topology. In the compose
    # network, JWKS is fetched via the internal DNS name instead
    # (CRM_SECURITY_JWKSETURI env override); issuer validation stays canonical.
    issuer: http://localhost:8180/realms/crm-lite
    # audience: crm-api and required-role: crm-user are the starter defaults.
    # Overrides (not extends) the starter's default permit-paths list, so
    # /actuator/health must be repeated here. /v3/api-docs is the OpenAPI JSON the
    # gateway proxies into the unified Swagger UI (ADR-012) — schema metadata only,
    # no business data, safe to leave anonymous like the docs page itself.
    permit-paths:
      - /actuator/health
      - /actuator/prometheus
      - /v3/api-docs/**
  lookup:
    base-url: http://lookup-service   # central GNL_ST/GNL_TP owner (ADR-002)
    cache-ttl: 15m
    cache-max-size: 256
  mernis:
    base-url: http://mernis-stub      # fake MERNIS/KPS (KR-10)
  # KR-02 child-record search criteria. customer-service resolves accountNumber and
  # orderNumber through the OWNING service's public API — it never reads account_db or
  # order_db (ADR-013 §5, ADR-016 §3.2). Reached directly via Eureka with the user's
  # token propagated (ADR-010), never through the gateway.
  account:
    base-url: http://account-service  # cust_acct owner (FR-ACCT, KR-11)
  order:
    base-url: http://order-service    # cust_ord owner (FR-SALE, KR-12)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Only the OpenAPI JSON is served here; the gateway hosts the actual Swagger UI
# and proxies this service's /v3/api-docs into it (ADR-012).
springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents

# Resilience4j (docs/runbooks/resilience.md): applied ONLY to durable synchronous
# reads — mernis (verification, no side effect despite the POST verb), lookup-service
# (shared catalog) and the two KR-02 cross-service search reads. Order matters
# per-call: connect/read timeout (HttpClientConfig#resilientRequestFactory) happens
# first inside the HTTP call itself, then bulkhead, then circuit breaker, then retry
# (outermost) — never applied to a write (HttpAccountServiceClient#passivateAccount
# is deliberately outside every instance below).
resilience4j:
  circuitbreaker:
    instances:
      mernis:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.customer.mernis.MernisUnavailableException
      lookup-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.customer.lookup.LookupCatalogUnavailableException
      account-service-read:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.customer.account.AccountServiceUnavailableException
      order-service-read:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.customer.order.OrderServiceUnavailableException
  bulkhead:
    instances:
      mernis:
        max-concurrent-calls: 10
      lookup-service:
        max-concurrent-calls: 20
      account-service-read:
        max-concurrent-calls: 10
      order-service-read:
        max-concurrent-calls: 10
  retry:
    instances:
      # Selective retry — ONLY the converted "unavailable" exception, never a
      # not-found (returned as Optional.empty(), not thrown) or a validation error.
      mernis:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.customer.mernis.MernisUnavailableException
      lookup-service:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.customer.lookup.LookupCatalogUnavailableException
      account-service-read:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.customer.account.AccountServiceUnavailableException
      order-service-read:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.customer.order.OrderServiceUnavailableException
