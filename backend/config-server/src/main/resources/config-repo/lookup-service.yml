server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lookup_db
    username: crmlite
    password: crmlite
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Zero-trust resource server (ADR-009): same canonical issuer rules as
# customer-service (see the comment there). JWKS override for compose:
# CRM_SECURITY_JWKSETURI.
crm:
  security:
    issuer: http://localhost:8180/realms/crm-lite

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
