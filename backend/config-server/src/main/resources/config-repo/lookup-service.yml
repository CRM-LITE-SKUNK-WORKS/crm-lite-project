server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lookup_db
    username: crmlite
    password: crmlite
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info
