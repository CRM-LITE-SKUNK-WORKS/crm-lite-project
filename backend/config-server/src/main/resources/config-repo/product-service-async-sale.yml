# product-service, Spring profile "async-sale" — the LIVE asynchronous SALE flow (ADR-018).
#
# Layered ON TOP of product-service.yml, which is unchanged and still ships every
# messaging switch OFF. Activate with SPRING_PROFILES_ACTIVE=async-sale.
#
# POST /api/products is untouched and still serves the legacy synchronous orchestration.
# The three consumers below route into the SAME ProductService methods, so basket
# composition, characteristic validation, the PNDG lifecycle and the sale-scoped
# compensation guard exist in exactly one place.

spring:
  cloud:
    function:
      # orderSubmitted is the pre-existing observe-only consumer from ADR-017; the three
      # sale* ones are the saga commands. All four must be listed — Spring Cloud Function
      # auto-discovers only a single function bean.
      #
      # Spring Cloud FUNCTION reads this key — NOT `spring.cloud.stream.function.definition`,
      # which reads naturally next to `stream:` below but is not a real property. Nesting it
      # under `stream:` leaves every function unbound: no consumer group ever forms, commands
      # sit un-consumed, and every saga stalls until retries exhaust.
      definition: orderSubmitted;prepareSaleProducts;activateSaleProducts;compensateSaleProducts
    stream:
      kafka:
        bindings:
          prepareSaleProducts-in-0:
            consumer:
              enable-dlq: true
              dlq-name: crm.product.cmd.prepare-sale-products.v1.dlq
          activateSaleProducts-in-0:
            consumer:
              enable-dlq: true
              dlq-name: crm.product.cmd.activate-sale-products.v1.dlq
          compensateSaleProducts-in-0:
            consumer:
              enable-dlq: true
              dlq-name: crm.product.cmd.compensate-sale-products.v1.dlq
      bindings:
        # max-attempts: 1 — the retry policy is the transport's redelivery plus the Inbox
        # duplicate guard, not an in-memory loop that re-runs a rolled-back handler while
        # holding the partition (ADR-017 §8.3).
        prepareSaleProducts-in-0:
          destination: crm.product.cmd.prepare-sale-products.v1
          group: product-service.crm.product.cmd.prepare-sale-products.v1
          consumer:
            max-attempts: 1
        activateSaleProducts-in-0:
          destination: crm.product.cmd.activate-sale-products.v1
          group: product-service.crm.product.cmd.activate-sale-products.v1
          consumer:
            max-attempts: 1
        compensateSaleProducts-in-0:
          destination: crm.product.cmd.compensate-sale-products.v1
          group: product-service.crm.product.cmd.compensate-sale-products.v1
          consumer:
            max-attempts: 1

crm:
  security:
    # ADR-010 addendum (2026-08-13): prepare/activate/compensate above run on a Kafka
    # listener thread, not inside an HTTP request — doCreate() still calls
    # customer-service (address ownership) and lookup-service (status ids) exactly as
    # the synchronous POST /api/products route does, but there is no user token there
    # for those RestClients to propagate. This client-credentials identity is the
    # fallback BearerTokenPropagationInterceptor reaches for when SecurityContextHolder
    # has no JwtAuthenticationToken — every request-bound call ADR-010 already
    # documents is completely unaffected. The secret is local-dev seed data
    # (infra/keycloak/realm/crm-lite-realm.json), same as this realm's other seeded
    # credentials — never a real one.
    service-account:
      client-id: crm-saga-worker
      client-secret: crm-saga-worker-dev-secret
      # Compose-internal, same reasoning as CRM_SECURITY_JWKSETURI in docker-compose.yml
      # (ADR-006): the canonical issuer is not reachable from inside this container.
      token-uri: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/token
  messaging:
    broker:
      enabled: true
    outbox:
      # Required, not optional: the saga's reply events are recorded here, so a
      # product-service with the outbox off would consume commands and answer nothing —
      # every sale would then stall until the recovery job escalated it.
      enabled: true
      relay:
        # In-process relay. Mutually exclusive with Debezium (ADR-017 §9.3) — set false
        # if you register the connectors.
        enabled: true
