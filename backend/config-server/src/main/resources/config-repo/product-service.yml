server:
  port: 8086
  # ADR-012: springdoc reads X-Forwarded-* for its self-detected server URL; the real
  # "Try it out" fix is the relative-server OpenApiConfig bean (see PROJECTBRAIN §4.7),
  # this setting is kept for parity with the other domain services.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: crmlite
    password: crmlite
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Outbound integration boundaries. Base URLs use Eureka service names resolved by the
# load-balanced RestClient; override with concrete http://host:port when running
# without discovery. crm.lookup arrived with the FR-SALE write slice (ADR-015 §4.1):
# persisting a status_id requires resolving it through the catalog owner, fail-closed.
# ADR-002 is otherwise unchanged — still no local gnl_* tables or seeds here, and
# READS still use the local LookupContract constants (no remote call per row).
crm:
  security:
    # Canonical issuer (ADR-006): must equal the JWT `iss` claim exactly. Keycloak's
    # KC_HOSTNAME pins tokens to this value in every topology. In the compose
    # network, JWKS is fetched via the internal DNS name instead
    # (CRM_SECURITY_JWKSETURI env override); issuer validation stays canonical.
    issuer: http://localhost:8180/realms/crm-lite
    # audience: crm-api and required-role: crm-user are the starter defaults.
    # Overrides (not extends) the starter's default permit-paths list, so
    # /actuator/health must be repeated here. /v3/api-docs is the OpenAPI JSON the
    # gateway proxies into the unified Swagger UI (ADR-012) — schema metadata only,
    # no business data, safe to leave anonymous like the docs page itself.
    permit-paths:
      - /actuator/health
      - /actuator/prometheus
      - /v3/api-docs/**
  account:
    base-url: http://account-service    # FR-PROD-01 composition (ADR-013 §7 read side)
  customer:
    base-url: http://customer-service   # FR-PROD-02 service-address resolution (ADR-010)
  lookup:
    base-url: http://lookup-service     # shared GNL_ST owner (ADR-002); writes only

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Only the OpenAPI JSON is served here; the gateway hosts the actual Swagger UI
# and proxies this service's /v3/api-docs into it (ADR-012).
springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents

# Resilience4j (docs/runbooks/resilience.md): lookup/account/customer READS only —
# never POST /api/products, /confirm or /compensate (the FR-SALE write slice
# order-service drives, ADR-015 §5, which is scheduled to move to messaging).
resilience4j:
  circuitbreaker:
    instances:
      lookup-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.product.lookup.LookupCatalogUnavailableException
      account-service-read:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.product.account.AccountServiceUnavailableException
      customer-service-read:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.product.customer.CustomerServiceUnavailableException
  bulkhead:
    instances:
      lookup-service:
        max-concurrent-calls: 20
      account-service-read:
        max-concurrent-calls: 10
      customer-service-read:
        max-concurrent-calls: 10
  retry:
    instances:
      lookup-service:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.product.lookup.LookupCatalogUnavailableException
      account-service-read:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.product.account.AccountServiceUnavailableException
      customer-service-read:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.product.customer.CustomerServiceUnavailableException
