server:
  port: 8086
  # ADR-012: springdoc reads X-Forwarded-* for its self-detected server URL; the real
  # "Try it out" fix is the relative-server OpenApiConfig bean (see PROJECTBRAIN §4.7),
  # this setting is kept for parity with the other domain services.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: crmlite
    password: crmlite
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Spring Cloud Stream (ADR-017 §7). Inert while crm.messaging.broker.enabled is false:
  # OrderEventStreamAdapter is @ConditionalOnProperty on that flag, so no function bean
  # exists, no binding is created, the Kafka binder is never instantiated, and the
  # service still starts with no broker present. This is the ONLY place in
  # product-service where a broker-specific setting may appear.
  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          required-acks: all
        # Binder-specific consumer settings. .dlq per Destinations#deadLetter — a message
        # this build cannot parse or version is terminal, and parking it is what keeps it
        # from blocking everything behind it on the partition.
        bindings:
          orderSubmitted-in-0:
            consumer:
              enable-dlq: true
              dlq-name: crm.order.evt.order-submitted.v1.dlq
      bindings:
        default:
          producer:
            # Set by StreamBridgeOutboxPublisher from the envelope's sagaId (else
            # aggregateId) — per-sale ordering, ADR-017 §7.6.
            partition-key-expression: headers['partitionKey']
        # The functional binding name is <function-bean-name>-in-0; the bean is
        # OrderEventStreamAdapter#orderSubmitted.
        orderSubmitted-in-0:
          destination: crm.order.evt.order-submitted.v1
          group: product-service.crm.order.evt.order-submitted.v1
          consumer:
            # Binder-level retry is DISABLED (maxAttempts 1) on purpose: the retry policy
            # lives in the transport's redelivery plus the Inbox's duplicate guard, and a
            # second, in-memory retry loop here would just re-run a handler whose
            # transaction already rolled back while holding up the partition.
            max-attempts: 1

# Outbound integration boundaries. Base URLs use Eureka service names resolved by the
# load-balanced RestClient; override with concrete http://host:port when running
# without discovery. crm.lookup arrived with the FR-SALE write slice (ADR-015 §4.1):
# persisting a status_id requires resolving it through the catalog owner, fail-closed.
# ADR-002 is otherwise unchanged — still no local gnl_* tables or seeds here, and
# READS still use the local LookupContract constants (no remote call per row).
crm:
  security:
    # Canonical issuer (ADR-006): must equal the JWT `iss` claim exactly. Keycloak's
    # KC_HOSTNAME pins tokens to this value in every topology. In the compose
    # network, JWKS is fetched via the internal DNS name instead
    # (CRM_SECURITY_JWKSETURI env override); issuer validation stays canonical.
    issuer: http://localhost:8180/realms/crm-lite
    # audience: crm-api and required-role: crm-user are the starter defaults.
    # Overrides (not extends) the starter's default permit-paths list, so
    # /actuator/health must be repeated here. /v3/api-docs is the OpenAPI JSON the
    # gateway proxies into the unified Swagger UI (ADR-012) — schema metadata only,
    # no business data, safe to leave anonymous like the docs page itself.
    permit-paths:
      - /actuator/health
      - /actuator/prometheus
      - /v3/api-docs/**
  account:
    base-url: http://account-service    # FR-PROD-01 composition (ADR-013 §7 read side)
  customer:
    base-url: http://customer-service   # FR-PROD-02 service-address resolution (ADR-010)
  lookup:
    base-url: http://lookup-service     # shared GNL_ST owner (ADR-002); writes only
  # Reliable messaging (ADR-017) — all three switches OFF; this branch adds the
  # foundation, not the cutover. POST /api/products still answers the SALE orchestration
  # synchronously (ADR-015 §5). See order-service.yml for what each flag does and
  # docs/runbooks/eventing.md for the cutover order.
  messaging:
    broker:
      enabled: false
    outbox:
      enabled: false
      relay:
        enabled: false
        poll-interval: 2s
        batch-size: 100
      retention:
        enabled: true
        keep-published-for: 7d
        run-interval: 1h

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Only the OpenAPI JSON is served here; the gateway hosts the actual Swagger UI
# and proxies this service's /v3/api-docs into it (ADR-012).
springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  health:
    # See order-service.yml: a binder health contributor would report DOWN for a broker
    # that is deliberately absent before cutover.
    binders:
      enabled: false

# Resilience4j (docs/runbooks/resilience.md): lookup/account/customer READS only —
# never POST /api/products, /confirm or /compensate (the FR-SALE write slice
# order-service drives, ADR-015 §5, which is scheduled to move to messaging).
resilience4j:
  circuitbreaker:
    instances:
      lookup-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.product.lookup.LookupCatalogUnavailableException
      account-service-read:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.product.account.AccountServiceUnavailableException
      customer-service-read:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.crm.product.customer.CustomerServiceUnavailableException
  bulkhead:
    instances:
      lookup-service:
        max-concurrent-calls: 20
      account-service-read:
        max-concurrent-calls: 10
      customer-service-read:
        max-concurrent-calls: 10
  retry:
    instances:
      lookup-service:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.product.lookup.LookupCatalogUnavailableException
      account-service-read:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.product.account.AccountServiceUnavailableException
      customer-service-read:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.crm.product.customer.CustomerServiceUnavailableException
