# Test-only configuration.
# - No config-server / Eureka: tests are self-contained.
# - No datasource here: integration tests start their own PostgreSQL via
#   Testcontainers and inject the URL with @DynamicPropertySource.
# - cache-ttl 0s forces every catalog resolve through the (mocked) client so
#   catalog-unavailable / unknown-code scenarios are deterministic per test.
spring:
  cloud:
    config:
      enabled: false
  config:
    import: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

eureka:
  client:
    enabled: false

crm:
  lookup:
    base-url: http://localhost:1   # never reached; LookupCatalogClient is mocked in tests
    cache-ttl: 0s
    cache-max-size: 256
  mernis:
    base-url: http://localhost:1   # never reached; MernisClient is mocked in tests
