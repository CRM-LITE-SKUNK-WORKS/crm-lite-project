# Test-only configuration: no config-server / Eureka; the database comes from
# Testcontainers via @DynamicPropertySource.
spring:
  cloud:
    config:
      enabled: false
  config:
    import: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

eureka:
  client:
    enabled: false
