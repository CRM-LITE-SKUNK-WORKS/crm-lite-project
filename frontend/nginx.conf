# Container-side half of FE-ADR-004: the browser must see exactly ONE origin, so
# nginx serves the SPA and reverse-proxies the four gateway prefixes over crm-net.
# This is behaviourally identical to the `ng serve` dev proxy
# (frontend/proxy.conf.json) — same four prefixes, same forwarded headers — so a
# proxy-related bug cannot exist in only one of the two environments.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The JS bundle dominates the transfer; compress text payloads.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------ gateway
    # /api, /oauth2, /login, /logout -> the BFF, by compose service name on
    # crm-net (the gateway's published host port is irrelevant to this hop).
    # Declared FIRST: nginx evaluates regex locations in source order, so this can
    # never be swallowed by the SPA fallback further down.
    location ~ ^/(api|oauth2|login|logout)(/|$) {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;

        # The gateway derives the OAuth2 redirect_uri from these headers
        # (forward-headers-strategy: framework, FE-ADR-004 §Addendum). Getting
        # them wrong makes Keycloak reject the login with invalid_redirect_uri.
        #
        # $http_host — NOT $host — is deliberate, and this is the whole trick:
        #   $host        strips the port  -> "localhost"      -> redirect_uri
        #                                    "http://localhost/..." (WRONG: that
        #                                    origin is not registered on crm-bff)
        #   $http_host   is the Host header exactly as the browser sent it
        #                                 -> "localhost:4200" -> correct origin
        #
        # X-Forwarded-Port is deliberately NOT set: inside the container nginx
        # listens on 80, so $server_port is 80 — the INTERNAL port, never the
        # published one (4200:80). Sending it would override the correct port
        # carried by X-Forwarded-Host. nginx cannot know the published port, so
        # the Host header stays the single source of truth.
        #
        # Nothing is hardcoded, so the image still works behind any hostname/port.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ------------------------------------------------------------- static assets
    # Filenames are content-hashed (outputHashing: all), so they are safe to cache
    # indefinitely — a new build produces new names.
    # One header only: `expires` would emit a second, separate Cache-Control and
    # the two would have to be merged by the client.
    location ~* \.(?:js|css|woff2|woff|ttf|svg|png|jpe?g|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is the file that names the hashed bundles,
    # so a cached copy would keep pointing at the previous deployment.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------- SPA fallback
    # A deep link such as /customers/1001 is an Angular route, not a file on disk.
    # It must return index.html so the router can resolve it, instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
