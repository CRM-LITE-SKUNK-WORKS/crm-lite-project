<!-- Contact medium update — mock §6.4: 560px modal, 4 fields (1fr 1fr,
     gap 20px 24px) in the recorded Email → Home → Mobile → Fax order. -->
<app-modal
  [open]="open()"
  size="md"
  [titleText]="'UI-DETAIL-CONTACT-UPDATE-TITLE' | t"
  [closeLabel]="'UI-COMMON-CLOSE' | t"
  testId="customer-detail-contact-dialog"
  (closed)="onCancel()"
>
  @if (bannerText(); as text) {
    <div
      class="mb-4 flex flex-col gap-1 rounded-md border border-danger-border bg-danger-surface p-3 text-body-sm text-danger-fg"
      role="alert"
      data-testid="customer-detail-contact-dialog-error-banner"
    >
      <span>{{ text }}</span>
      @for (fieldError of unmatchedFieldErrors(); track fieldError.field) {
        <span>{{ fieldError.messageKey | t }}</span>
      }
    </div>
  }

  <form
    [formGroup]="form"
    class="grid grid-cols-2 gap-x-6 gap-y-5"
    (ngSubmit)="onSave()"
    data-testid="customer-detail-contact-dialog-form"
  >
    <app-form-field
      [label]="'UI-CREATE-FIELD-EMAIL' | t"
      controlId="customer-detail-contact-email"
      [required]="true"
      [errorText]="errorTextFor('email')"
      testId="customer-detail-contact-dialog-email"
    >
      <app-text-input
        formControlName="email"
        controlId="customer-detail-contact-email"
        inputMode="email"
        iconLeading="mail"
        [placeholder]="'UI-CONTACT-PLACEHOLDER-EMAIL' | t"
        [error]="!!errorTextFor('email')"
        describedBy="customer-detail-contact-email-error"
        testId="customer-detail-contact-dialog-email-input"
      />
    </app-form-field>

    <app-form-field
      [label]="'UI-CREATE-FIELD-HOME' | t"
      controlId="customer-detail-contact-home"
      [optionalText]="'UI-COMMON-OPTIONAL' | t"
      [errorText]="errorTextFor('homePhone')"
      testId="customer-detail-contact-dialog-home"
    >
      <app-text-input
        formControlName="homePhone"
        controlId="customer-detail-contact-home"
        inputMode="numeric"
        [maxLength]="11"
        [placeholder]="'UI-CONTACT-PLACEHOLDER-PHONE' | t"
        [error]="!!errorTextFor('homePhone')"
        describedBy="customer-detail-contact-home-error"
        testId="customer-detail-contact-dialog-home-input"
      />
    </app-form-field>

    <app-form-field
      [label]="'UI-CREATE-FIELD-MOBILE' | t"
      controlId="customer-detail-contact-mobile"
      [required]="true"
      [errorText]="errorTextFor('mobilePhone')"
      testId="customer-detail-contact-dialog-mobile"
    >
      <app-text-input
        formControlName="mobilePhone"
        controlId="customer-detail-contact-mobile"
        inputMode="numeric"
        [maxLength]="11"
        [placeholder]="'UI-CONTACT-PLACEHOLDER-MOBILE' | t"
        [error]="!!errorTextFor('mobilePhone')"
        describedBy="customer-detail-contact-mobile-error"
        testId="customer-detail-contact-dialog-mobile-input"
      />
    </app-form-field>

    <app-form-field
      [label]="'UI-CREATE-FIELD-FAX' | t"
      controlId="customer-detail-contact-fax"
      [optionalText]="'UI-COMMON-OPTIONAL' | t"
      [errorText]="errorTextFor('fax')"
      testId="customer-detail-contact-dialog-fax"
    >
      <app-text-input
        formControlName="fax"
        controlId="customer-detail-contact-fax"
        inputMode="numeric"
        [maxLength]="11"
        [placeholder]="'UI-CONTACT-PLACEHOLDER-PHONE' | t"
        [error]="!!errorTextFor('fax')"
        describedBy="customer-detail-contact-fax-error"
        testId="customer-detail-contact-dialog-fax-input"
      />
    </app-form-field>
  </form>

  <div appModalFooter class="flex gap-3">
    <app-button
      variant="secondary"
      testId="customer-detail-contact-dialog-cancel-button"
      (action)="onCancel()"
    >
      {{ 'LBL-CANCEL' | t }}
    </app-button>
    <app-button
      iconLeading="check"
      [disabled]="!canSave()"
      [loading]="busy()"
      testId="customer-detail-contact-dialog-save-button"
      (action)="onSave()"
    >
      {{ 'LBL-SAVE' | t }}
    </app-button>
  </div>
</app-modal>
