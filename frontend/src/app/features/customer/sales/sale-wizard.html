<!--
  Layout mirrors the decoded mock screens (scope §2B.7): page heading + account
  context, then the 3-step indicator, then a scrolling content area, then a
  fixed page footer. All three mock screens share this frame exactly.
-->
<!--
  NO `p-6` here: the shell's `<main class="… p-6">` already pads the page, and
  the Create-Customer wizard — the closest sibling screen — relies on exactly
  that. Adding it again stacked 24px on 24px, which both pushed the heading down
  and stole 48px of height from the catalog card.

  `min-h-0` on the root is REQUIRED, not incidental: it is what lets the results
  list be the one thing that absorbs a squeeze, so the card's tabs, search form
  and footer keep their size and the list scrolls internally (the mock's design).
  Dropping it was tried and rejected — the intrinsic minimum then propagates, the
  table expands to all rows, the page grows past the viewport and every control
  lands below the fold. Measured: page height 1714px, zero controls reachable.
-->
<div class="flex min-h-0 flex-1 flex-col gap-5" data-testid="sale-wizard">
  <!-- Page header -->
  <div class="flex shrink-0 flex-col gap-5">
    <div class="flex flex-col gap-1">
      <!-- `tracking-heading` (-0.2px) is the mock's screen-h1 tracking; the
           other two screen headings already carry it (A2). -->
      <h1 class="text-h2 font-semibold tracking-heading text-ink">{{ titleKey() | t }}</h1>
      @if (accountContext()) {
        <span
          class="eds-tabular-nums text-body-sm text-ink-muted"
          data-testid="sale-account-context"
        >
          {{ accountContext() }}
        </span>
      }
    </div>

    <!-- The sale wizard uses the mock's OWN second step strip, which differs
         from Create Customer's on seven counts (bare 1/2/3, 24px outlined
         circles, hairline connector…) — see StepperVariant / scope §4.33. -->
    <app-stepper
      [steps]="steps()"
      [activeIndex]="activeIndex()"
      variant="sale"
      testId="sale-stepper"
    />
  </div>

  <!--
    Step content. NO `overflow-y-auto` here on purpose: each step owns its own
    scrolling exactly as the mock does (step 1's scroll owner is the RESULTS
    box inside the catalog card; steps 2 and 3 scroll their whole column). A
    scroll container here would be a SECOND one nested around the first, and it
    squeezes the card until the results box shows only a few rows.
  -->
  <div class="flex min-h-0 flex-1 flex-col">
    @if (isOffer()) {
      <app-offer-selection-step />
    } @else if (isConfig()) {
      <app-product-configuration-step />
    } @else {
      <app-submit-order-step />
    }
  </div>

  <!--
    Page footer. Mock: step 1 is right-aligned (Cancel + Next); steps 2 and 3
    are space-between with Previous on the left, and step 3 replaces Next with
    Submit.

    There is no longer a SUCCESS footer: a successful submit navigates straight
    to Customer Info (scope §4.33), so this screen never outlives the order it
    created and Submit cannot be reached a second time from the UI — the screen
    half of the duplicate-submit guard (AC-SALE-01-15). `OrderSubmitStore.locked`
    is the other half and still refuses a second POST regardless.
  -->
  <div
    class="flex shrink-0 gap-3"
    [class.justify-end]="isOffer()"
    [class.justify-between]="!isOffer()"
  >
      @if (!isOffer()) {
        <app-button
          variant="secondary"
          iconLeading="arrow-left"
          testId="sale-previous-button"
          (action)="goPrevious()"
        >
          {{ 'LBL-PREVIOUS' | t }}
        </app-button>
      }

      <div class="flex gap-3">
        <!-- The mock paints step 2's Cancel `ghost` and step 1/3's
             `secondary`. `shared/ui` has no ghost BUTTON variant (only
             IconButton has one), so all three render secondary rather than
             inventing a variant outside the design system (FE-ADR-011 §b). -->
        <app-button variant="secondary" testId="sale-cancel-button" (action)="cancel()">
          {{ 'LBL-CANCEL' | t }}
        </app-button>

        @if (isSummary()) {
          <app-button
            variant="primary"
            iconLeading="check"
            [disabled]="submitDisabled()"
            [loading]="submitStore.inFlight()"
            testId="sale-submit-button"
            (action)="openConfirm()"
          >
            {{ 'LBL-SUBMIT' | t }}
          </app-button>
        } @else {
          <app-button
            variant="primary"
            iconTrailing="arrow-right"
            [disabled]="nextDisabled()"
            testId="sale-next-button"
            (action)="goNext()"
          >
            {{ 'LBL-NEXT' | t }}
          </app-button>
        }
      </div>
  </div>
</div>

<!-- AC-SALE-01-15: Submit opens this first and sends nothing until "Yes".
     `tone="info"` is the mock's own paint for this dialog (a FLAT info glyph and
     a primary Yes carrying a check) as opposed to the destructive confirmations,
     which keep the tinted danger disc. The body states which account and how
     much rather than asking a bare "are you sure" (scope §4.33). -->
<app-confirm-dialog
  [open]="confirmOpen()"
  tone="info"
  icon="info"
  [title]="'UI-SALE-CONFIRM-TITLE' | t"
  [message]="confirmMessage()"
  [confirmLabel]="'LBL-YES' | t"
  [cancelLabel]="'LBL-NO' | t"
  [closeLabel]="'UI-COMMON-CLOSE' | t"
  [busy]="submitStore.inFlight()"
  testId="sale-submit-confirm-dialog"
  (confirmed)="confirmSubmit()"
  (cancelled)="closeConfirm()"
/>
