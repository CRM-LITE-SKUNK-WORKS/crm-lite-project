# CRM Lite - local orchestration
#
# Vendor-neutral Compose Spec. Runs identically on:
#   - Rancher Desktop (dockerd backend):  docker compose ...
#   - Podman:                             podman-compose ...  (or: podman compose ...)
#
# NOTE: build context is the repository ROOT (..), not the service folder,
# because each service's pom.xml inherits from the root parent pom.xml.
#
# NOTE ON HEALTHCHECKS: depends_on alone only waits for a container to START,
# not for the Spring Boot app inside it to finish booting and open its port.
# Since spring.config.import's config-server fetch is a one-shot attempt (no
# fail-fast/retry configured), a dependent service starting even a few seconds
# before config-server is actually listening will silently fall back to
# hard-coded defaults (e.g. localhost:8761 for Eureka) for its entire process
# lifetime. The healthchecks below + `condition: service_healthy` make
# dependents actually wait until the upstream service is ready to answer.
# The runtime images (eclipse-temurin:*-jre, non-alpine) don't have curl/wget,
# so JVM service healthchecks use bash's /dev/tcp to check the port is open.

services:
  config-server:
    build:
      context: ..
      dockerfile: backend/config-server/Dockerfile
    image: crm-lite/config-server:local
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8888' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - crm-net

  discovery-server:
    build:
      context: ..
      dockerfile: backend/discovery-server/Dockerfile
    image: crm-lite/discovery-server:local
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      # Inside the container network config-server is reached by its service
      # name, NOT localhost. This overrides the value in application.yml.
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8761' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - crm-net

  api-gateway:
    build:
      context: ..
      dockerfile: backend/api-gateway/Dockerfile
    image: crm-lite/api-gateway:local
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      # Inside the container network the gateway must reach Eureka by its
      # service name, NOT localhost. This overrides the value from config-server.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      # Server-to-server Keycloak calls (token endpoint, JWKS) use the internal DNS
      # name; the browser-facing base-url / issuer stays http://localhost:8180.
      CRM_SECURITY_KEYCLOAK_INTERNALBASEURL: http://keycloak:8180
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - crm-net

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: crmlite
      POSTGRES_PASSWORD: crmlite
      POSTGRES_DB: crm_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crmlite -d crm_admin"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - crm-net

  keycloak:
    # Pinned version (ADR-006). Sole identity/token authority for CRM Lite.
    # KC_HOSTNAME is pinned to the browser-facing URL so the JWT `iss` claim is
    # ALWAYS http://localhost:8180/realms/crm-lite, no matter whether the caller
    # reached Keycloak via localhost (browser/IDE-run services) or via the
    # compose-internal DNS name keycloak:8180 (containerised services). Services
    # validate `iss` against that canonical value and may fetch JWKS from the
    # internal URL (crm.security.* overrides) — no localhost/keycloak split 401s.
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: crmlite
      KC_DB_PASSWORD: crmlite
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      # Local-only bootstrap admin for the dev realm console. Disposable value,
      # never used by the application itself.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # CRM Lite login theme (FR-AUTH-01 UI; ADR-006). start-dev disables theme
      # caching, so edits under ./keycloak/themes show on a browser refresh — no
      # container restart. The realm's "loginTheme": "crm-lite" selects it.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # Keycloak's image (like the temurin JRE images) has bash but no curl/wget.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8180' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-net

  # One-shot: reconciles realm settings that `--import-realm` cannot deliver to an
  # EXISTING keycloak_db. `--import-realm` imports ONLY on first start (when the
  # realm is absent), so a developer whose keycloak_db predates a realm change keeps
  # the old values — for the login theme that meant Keycloak's stock login page, and
  # for the redirect URIs below it would mean a broken frontend login. This container
  # removes those manual Admin Console steps: on every `up` it re-applies both.
  # Idempotent (rewrites the same values), and nothing depends_on it, so if it ever
  # fails the rest of the stack still comes up exactly as before.
  #
  # Applied settings:
  #   1. realm loginTheme = crm-lite            (FR-AUTH-01 UI; ADR-006)
  #   2. crm-bff redirectUris / webOrigins      (FE-ADR-004: frontend on :4200 must
  #      / post.logout.redirect.uris             be a valid OAuth origin alongside
  #                                              the gateway's own :8080)
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak-init
    # The image ENTRYPOINT is kc.sh, which would swallow the shell command; it has
    # to be overridden to run kcadm.sh. Same disposable local-only bootstrap admin
    # as the keycloak service above.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/keycloak/bin/kcadm.sh config credentials
        --server http://keycloak:8180 --realm master --user admin --password admin &&
        /opt/keycloak/bin/kcadm.sh update realms/crm-lite -s loginTheme=crm-lite &&
        echo "keycloak-init: loginTheme=crm-lite applied to realm crm-lite" &&
        CID=$$(/opt/keycloak/bin/kcadm.sh get clients -r crm-lite --query clientId=crm-bff --fields id --format csv --noquotes) &&
        /opt/keycloak/bin/kcadm.sh update clients/$$CID -r crm-lite
        -s 'redirectUris=["http://localhost:8080/login/oauth2/code/keycloak","http://localhost:4200/login/oauth2/code/keycloak"]'
        -s 'webOrigins=["http://localhost:8080","http://localhost:4200"]'
        -s 'attributes."post.logout.redirect.uris"=http://localhost:8080/*##http://localhost:4200/*' &&
        echo "keycloak-init: crm-bff redirect URIs applied (:8080 gateway + :4200 frontend)"
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    networks:
      - crm-net

  lookup-service:
    build:
      context: ..
      dockerfile: backend/lookup-service/Dockerfile
    image: crm-lite/lookup-service:local
    container_name: lookup-service
    # No published host port (ADR-009): all client traffic enters through the
    # gateway BFF; direct calls inside crm-net still require a valid Keycloak JWT.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lookup_db
      SPRING_DATASOURCE_USERNAME: crmlite
      SPRING_DATASOURCE_PASSWORD: crmlite
      # JWKS via internal DNS; issuer validation stays on the canonical value.
      CRM_SECURITY_JWKSETURI: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/certs
    # JWKS is fetched lazily on the first request, so Keycloak is not a hard startup
    # dependency; no depends_on needed beyond the existing ones.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - crm-net

  mernis-stub:
    build:
      context: ..
      dockerfile: backend/mernis-stub/Dockerfile
    image: crm-lite/mernis-stub:local
    container_name: mernis-stub
    # No published host port: simulates an EXTERNAL system (KR-10) reachable only
    # by customer-service inside crm-net; it never joins the CRM Keycloak realm
    # (ADR-010) and is not exposed to the host or the gateway.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8084' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - crm-net

  customer-service:
    build:
      context: ..
      dockerfile: backend/customer-service/Dockerfile
    image: crm-lite/customer-service:local
    container_name: customer-service
    # No published host port (ADR-009): all client traffic enters through the
    # gateway BFF; direct calls inside crm-net still require a valid Keycloak JWT.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: crmlite
      SPRING_DATASOURCE_PASSWORD: crmlite
      # JWKS via internal DNS; issuer validation stays on the canonical value.
      CRM_SECURITY_JWKSETURI: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Writes need the shared catalog (ADR-002) and MERNIS (KR-10); reads do not,
      # but waiting for them gives a fully usable stack on first `up`.
      lookup-service:
        condition: service_healthy
      mernis-stub:
        condition: service_healthy
    networks:
      - crm-net

  account-service:
    build:
      context: ..
      dockerfile: backend/account-service/Dockerfile
    image: crm-lite/account-service:local
    container_name: account-service
    # No published host port (ADR-009): all client traffic enters through the
    # gateway BFF; direct calls inside crm-net still require a valid Keycloak JWT.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: crmlite
      SPRING_DATASOURCE_PASSWORD: crmlite
      # JWKS via internal DNS; issuer validation stays on the canonical value.
      CRM_SECURITY_JWKSETURI: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Writes need the shared catalog (ADR-002) and customer/address validation
      # (ADR-013); reads do not, but waiting gives a fully usable stack on first `up`.
      lookup-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    networks:
      - crm-net

  # Frontend SPA (FE-ADR-010). Multi-stage build: the Node toolchain stays in the
  # build stage and the runtime image is nginx + static assets only.
  #
  # nginx also reverse-proxies /api, /oauth2, /login and /logout to the gateway
  # over crm-net, so the browser sees ONE origin — the container-side half of
  # FE-ADR-004, behaviourally identical to the `ng serve` dev proxy. That is why
  # no API URL is injected here: the app calls relative paths and nginx decides
  # the upstream (FE-ADR-010 §6).
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: crm-lite/frontend:local
    container_name: frontend
    # 4200 matches `ng serve`, so the browser-facing origin is identical in
    # development and in the container (FE-ADR-010 §5). That matters: this exact
    # origin is registered on the crm-bff Keycloak client by keycloak-init.
    ports:
      - "4200:80"
    healthcheck:
      # nginx:alpine has BusyBox wget but no bash, so the `</dev/tcp` probe the
      # JVM services use is not available here.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      # The proxy target must already be answering, otherwise the first page load
      # races the gateway's boot and every API call 502s.
      api-gateway:
        condition: service_healthy
    networks:
      - crm-net

networks:
  crm-net:
    driver: bridge

volumes:
  postgres-data: