# CRM Lite - local orchestration
#
# Vendor-neutral Compose Spec. Runs identically on:
#   - Rancher Desktop (dockerd backend):  docker compose ...
#   - Podman:                             podman-compose ...  (or: podman compose ...)
#
# NOTE: build context is the repository ROOT (..), not the service folder,
# because each service's pom.xml inherits from the root parent pom.xml.
#
# NOTE ON HEALTHCHECKS: depends_on alone only waits for a container to START,
# not for the Spring Boot app inside it to finish booting and open its port.
# Since spring.config.import's config-server fetch is a one-shot attempt (no
# fail-fast/retry configured), a dependent service starting even a few seconds
# before config-server is actually listening will silently fall back to
# hard-coded defaults (e.g. localhost:8761 for Eureka) for its entire process
# lifetime. The healthchecks below + `condition: service_healthy` make
# dependents actually wait until the upstream service is ready to answer.
# The runtime images (eclipse-temurin:*-jre, non-alpine) don't have curl/wget,
# so JVM service healthchecks use bash's /dev/tcp to check the port is open.

services:
  config-server:
    build:
      context: ..
      dockerfile: backend/config-server/Dockerfile
    image: crm-lite/config-server:local
    container_name: config-server
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8888' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - crm-net

  discovery-server:
    build:
      context: ..
      dockerfile: backend/discovery-server/Dockerfile
    image: crm-lite/discovery-server:local
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      # Inside the container network config-server is reached by its service
      # name, NOT localhost. This overrides the value in application.yml.
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8761' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - crm-net

  api-gateway:
    build:
      context: ..
      dockerfile: backend/api-gateway/Dockerfile
    image: crm-lite/api-gateway:local
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      # Inside the container network the gateway must reach Eureka by its
      # service name, NOT localhost. This overrides the value from config-server.
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      # Server-to-server Keycloak calls (token endpoint, JWKS) use the internal DNS
      # name; the browser-facing base-url / issuer stays http://localhost:8180.
      CRM_SECURITY_KEYCLOAK_INTERNALBASEURL: http://keycloak:8180
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - crm-net

  postgres:
    image: postgres:16
    container_name: postgres
    # wal_level=logical is what makes Debezium's Outbox Event Router possible at all
    # (ADR-017 §9): logical decoding cannot be turned on at runtime, it needs a restart,
    # so it is set unconditionally rather than only under the eventing profile — a
    # developer must not have to recreate their database volume to try the profile.
    # The cost when Debezium is not running is a slightly larger WAL and nothing else;
    # no slot is created until a connector asks for one.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: crmlite
      POSTGRES_PASSWORD: crmlite
      POSTGRES_DB: crm_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crmlite -d crm_admin"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - crm-net

  keycloak:
    # Pinned version (ADR-006). Sole identity/token authority for CRM Lite.
    # KC_HOSTNAME is pinned to the browser-facing URL so the JWT `iss` claim is
    # ALWAYS http://localhost:8180/realms/crm-lite, no matter whether the caller
    # reached Keycloak via localhost (browser/IDE-run services) or via the
    # compose-internal DNS name keycloak:8180 (containerised services). Services
    # validate `iss` against that canonical value and may fetch JWKS from the
    # internal URL (crm.security.* overrides) — no localhost/keycloak split 401s.
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: crmlite
      KC_DB_PASSWORD: crmlite
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      # Local-only bootstrap admin for the dev realm console. Disposable value,
      # never used by the application itself.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      # CRM Lite login theme (FR-AUTH-01 UI; ADR-006). start-dev disables theme
      # caching, so edits under ./keycloak/themes show on a browser refresh — no
      # container restart. The realm's "loginTheme": "crm-lite" selects it.
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # Keycloak's image (like the temurin JRE images) has bash but no curl/wget.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8180' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-net

  # One-shot: reconciles realm settings that `--import-realm` cannot deliver to an
  # EXISTING keycloak_db. `--import-realm` imports ONLY on first start (when the
  # realm is absent), so a developer whose keycloak_db predates a realm change keeps
  # the old values — for the login theme that meant Keycloak's stock login page, and
  # for the redirect URIs below it would mean a broken frontend login. This container
  # removes those manual Admin Console steps: on every `up` it re-applies both.
  # Idempotent (rewrites the same values), and nothing depends_on it, so if it ever
  # fails the rest of the stack still comes up exactly as before.
  #
  # Applied settings:
  #   1. realm loginTheme = crm-lite            (FR-AUTH-01 UI; ADR-006)
  #   2. crm-bff redirectUris / webOrigins      (FE-ADR-004: frontend on :4200 must
  #      / post.logout.redirect.uris             be a valid OAuth origin alongside
  #                                              the gateway's own :8080)
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak-init
    # The image ENTRYPOINT is kc.sh, which would swallow the shell command; it has
    # to be overridden to run kcadm.sh. Same disposable local-only bootstrap admin
    # as the keycloak service above.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/keycloak/bin/kcadm.sh config credentials
        --server http://keycloak:8180 --realm master --user admin --password admin &&
        /opt/keycloak/bin/kcadm.sh update realms/crm-lite -s loginTheme=crm-lite &&
        echo "keycloak-init: loginTheme=crm-lite applied to realm crm-lite" &&
        CID=$$(/opt/keycloak/bin/kcadm.sh get clients -r crm-lite --query clientId=crm-bff --fields id --format csv --noquotes) &&
        /opt/keycloak/bin/kcadm.sh update clients/$$CID -r crm-lite
        -s 'redirectUris=["http://localhost:8080/login/oauth2/code/keycloak","http://localhost:4200/login/oauth2/code/keycloak"]'
        -s 'webOrigins=["http://localhost:8080","http://localhost:4200"]'
        -s 'attributes."post.logout.redirect.uris"=http://localhost:8080/*##http://localhost:4200/*' &&
        echo "keycloak-init: crm-bff redirect URIs applied (:8080 gateway + :4200 frontend)"
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    networks:
      - crm-net

  lookup-service:
    build:
      context: ..
      dockerfile: backend/lookup-service/Dockerfile
    image: crm-lite/lookup-service:local
    container_name: lookup-service
    # No published host port (ADR-009): all client traffic enters through the
    # gateway BFF; direct calls inside crm-net still require a valid Keycloak JWT.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lookup_db
      SPRING_DATASOURCE_USERNAME: crmlite
      SPRING_DATASOURCE_PASSWORD: crmlite
      # JWKS via internal DNS; issuer validation stays on the canonical value.
      CRM_SECURITY_JWKSETURI: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/certs
    # JWKS is fetched lazily on the first request, so Keycloak is not a hard startup
    # dependency; no depends_on needed beyond the existing ones.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8083' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - crm-net

  mernis-stub:
    build:
      context: ..
      dockerfile: backend/mernis-stub/Dockerfile
    image: crm-lite/mernis-stub:local
    container_name: mernis-stub
    # No published host port: simulates an EXTERNAL system (KR-10) reachable only
    # by customer-service inside crm-net; it never joins the CRM Keycloak realm
    # (ADR-010) and is not exposed to the host or the gateway.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8084' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    networks:
      - crm-net

  customer-service:
    build:
      context: ..
      dockerfile: backend/customer-service/Dockerfile
    image: crm-lite/customer-service:local
    container_name: customer-service
    # No published host port (ADR-009): all client traffic enters through the
    # gateway BFF; direct calls inside crm-net still require a valid Keycloak JWT.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_db
      SPRING_DATASOURCE_USERNAME: crmlite
      SPRING_DATASOURCE_PASSWORD: crmlite
      # JWKS via internal DNS; issuer validation stays on the canonical value.
      CRM_SECURITY_JWKSETURI: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Writes need the shared catalog (ADR-002) and MERNIS (KR-10); reads do not,
      # but waiting for them gives a fully usable stack on first `up`.
      lookup-service:
        condition: service_healthy
      mernis-stub:
        condition: service_healthy
    networks:
      - crm-net

  account-service:
    build:
      context: ..
      dockerfile: backend/account-service/Dockerfile
    image: crm-lite/account-service:local
    container_name: account-service
    # No published host port (ADR-009): all client traffic enters through the
    # gateway BFF; direct calls inside crm-net still require a valid Keycloak JWT.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: crmlite
      SPRING_DATASOURCE_PASSWORD: crmlite
      # JWKS via internal DNS; issuer validation stays on the canonical value.
      CRM_SECURITY_JWKSETURI: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/certs
      # ADR-018: EMPTY by default, so a plain `docker compose up` runs exactly as it
      # always has — no Kafka, no bindings, no binder. Set async-sale to make the
      # asynchronous SALE flow live:
      #   docker compose --profile eventing up -d
      #   SPRING_PROFILES_ACTIVE=async-sale docker compose up -d --force-recreate \
      #       account-service product-service order-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # The binder default (localhost:9092) resolves to the service's OWN container,
      # where nothing listens. Without this the bindings never connect: no topic is
      # created and the Outbox relay fails every attempt with "Dispatcher has no
      # subscribers". Harmless when the eventing profile is down — nothing reads it.
      KAFKA_BROKERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Writes need the shared catalog (ADR-002) and customer/address validation
      # (ADR-013); reads do not, but waiting gives a fully usable stack on first `up`.
      lookup-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
    networks:
      - crm-net

  product-service:
    build:
      context: ..
      dockerfile: backend/product-service/Dockerfile
    image: crm-lite/product-service:local
    container_name: product-service
    # No published host port (ADR-009): all client traffic enters through the
    # gateway BFF; direct calls inside crm-net still require a valid Keycloak JWT.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: crmlite
      SPRING_DATASOURCE_PASSWORD: crmlite
      # JWKS via internal DNS; issuer validation stays on the canonical value.
      CRM_SECURITY_JWKSETURI: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/certs
      # ADR-018 — see account-service above. Empty by default; async-sale turns on the
      # broker, the Outbox and the three SALE command consumers.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # See account-service above.
      KAFKA_BROKERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8086' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # The FR-PROD-01 list composes over account-service and the FR-PROD-02
      # detail resolves addresses via customer-service; waiting for both gives a
      # fully usable stack on first `up`.
      customer-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    networks:
      - crm-net

  # Sale orchestration and orders (FR-SALE-01..02, ADR-016).
  order-service:
    build:
      context: ..
      dockerfile: backend/order-service/Dockerfile
    image: crm-lite/order-service:local
    container_name: order-service
    # No published host port (ADR-009): all client traffic enters through the
    # gateway BFF; direct calls inside crm-net still require a valid Keycloak JWT.
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: crmlite
      SPRING_DATASOURCE_PASSWORD: crmlite
      # JWKS via internal DNS; issuer validation stays on the canonical value.
      CRM_SECURITY_JWKSETURI: http://keycloak:8180/realms/crm-lite/protocol/openid-connect/certs
      # ADR-018 — see account-service above. Empty by default, in which case
      # POST /api/orders/{n}/submit answers 503 MSG-SERVICE-UNAVAILABLE (fail closed)
      # and the deprecated synchronous POST /api/orders is the working route.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # See account-service above.
      KAFKA_BROKERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8087' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # The sale orchestration writes through BOTH of these (ADR-016 §5): products
      # are created in product-service and linked through account-service's
      # involvement command. Waiting for them means the first `up` produces a stack
      # where a sale can actually complete rather than one that 503s on submit.
      product-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    networks:
      - crm-net

  # Frontend SPA (FE-ADR-010). Multi-stage build: the Node toolchain stays in the
  # build stage and the runtime image is nginx + static assets only.
  #
  # nginx also reverse-proxies /api, /oauth2, /login and /logout to the gateway
  # over crm-net, so the browser sees ONE origin — the container-side half of
  # FE-ADR-004, behaviourally identical to the `ng serve` dev proxy. That is why
  # no API URL is injected here: the app calls relative paths and nginx decides
  # the upstream (FE-ADR-010 §6).
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: crm-lite/frontend:local
    container_name: frontend
    # 4200 matches `ng serve`, so the browser-facing origin is identical in
    # development and in the container (FE-ADR-010 §5). That matters: this exact
    # origin is registered on the crm-bff Keycloak client by keycloak-init.
    ports:
      - "4200:80"
    healthcheck:
      # nginx:alpine has BusyBox wget but no bash, so the `</dev/tcp` probe the
      # JVM services use is not available here.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      # The proxy target must already be answering, otherwise the first page load
      # races the gateway's boot and every API call 502s.
      api-gateway:
        condition: service_healthy
    networks:
      - crm-net

  # ---------------------------------------------------------------------------
  # Observability stack (docs/runbooks/observability.md) — OPT-IN via the
  # "observability" Compose profile, never started by a plain `docker compose up`:
  #   docker compose --profile observability up -d
  # None of these publish a host port that overlaps an application concern;
  # Prometheus/Grafana/Loki ports below ARE published for local dashboard/API
  # access (this is a local dev stack, ADR-009's "no host port" rule targets the
  # APPLICATION services, not the monitoring tooling that observes them).
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: prometheus
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - crm-net

  loki:
    image: grafana/loki:3.5.6
    container_name: loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - crm-net

  alloy:
    image: grafana/alloy:v1.11.2
    container_name: alloy
    profiles: ["observability"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      # Read-only docker socket access to discover containers and tail their
      # stdout (the structured JSON every service now emits).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - crm-net

  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Local-only dev convenience, same posture as the Keycloak bootstrap admin
      # above — never used in a real deployment of this stack.
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - crm-net

  # ---------------------------------------------------------------------------
  # Eventing stack (docs/runbooks/eventing.md, ADR-017) — OPT-IN via the "eventing"
  # Compose profile, never started by a plain `docker compose up`:
  #   docker compose --profile eventing up -d
  #
  # This is the ONLY place in the repository where Kafka, Kafka Connect and Debezium
  # appear (ADR-017 §3): the application services stay broker-agnostic and start
  # perfectly well with this profile down, because crm.messaging.broker.enabled is
  # false in every service's configuration. Starting the profile does NOT cut the SALE
  # flow over to messaging — that is a separate, deliberate configuration change.
  # ---------------------------------------------------------------------------

  kafka:
    # KRaft mode: no ZooKeeper. Single broker, which is why every topic below is
    # created with replication factor 1 — a local dev stack, not a durability model
    # anyone should copy into a real deployment.
    image: apache/kafka:3.9.0
    container_name: kafka
    profiles: ["eventing"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two listeners on purpose: containers on crm-net reach kafka:9092, while a
      # service running from the IDE on the host reaches localhost:29092. A single
      # advertised listener would break one of those two, and both are normal here.
      # The controller listener binds to the routable container hostname, not
      # 0.0.0.0: KRaft advertises the controller endpoint from `listeners` (it is
      # deliberately absent from advertised.listeners below), and Kafka refuses to
      # advertise the nonroutable meta-address — StorageTool fails before the log
      # directory is even formatted. The broker listeners keep 0.0.0.0 because
      # they have their own advertised values.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: crm-lite-local-cluster
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - crm-net

  # Kafka Connect with the Debezium PostgreSQL connector and the Outbox Event Router SMT
  # already on the image. It is the PRIMARY outbox relay (ADR-017 §9): it reads the WAL,
  # so publishing needs no application thread and no polling.
  #
  # It reads three DIFFERENT databases through three separate connectors, each with its
  # own replication slot and publication. That is NOT cross-database access by a service:
  # every connector is bound to exactly the outbox table of the service that owns that
  # database, and no service ever reads another's tables (ADR-002/ADR-017 §9.4).
  kafka-connect:
    image: debezium/connect:3.0.0.Final
    container_name: kafka-connect
    profiles: ["eventing"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: crm-lite-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      # The envelope is already JSON produced by the application; Connect must pass the
      # bytes through unchanged rather than wrapping them in its own schema envelope,
      # otherwise the consumer's EnvelopeCodec would be handed something it never wrote.
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8083/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - crm-net

  # One-shot connector registration, same pattern (and same rationale) as keycloak-init:
  # PUT is idempotent, so every `up` re-applies the same three configurations, and
  # nothing depends_on this container — if it fails the rest of the stack still comes up.
  kafka-connect-init:
    image: curlimages/curl:8.11.1
    container_name: kafka-connect-init
    profiles: ["eventing"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      # A literal block (|), not a folded one (>): a folded scalar keeps the newlines of
      # more-indented lines, which would split each curl invocation across two commands.
      - |
        set -e
        for svc in order product account; do
          echo "kafka-connect-init: registering $${svc}-outbox-connector"
          curl -sS -X PUT -H 'Content-Type: application/json' --data @/connectors/$${svc}-outbox-connector.json http://kafka-connect:8083/connectors/$${svc}-outbox-connector/config
          echo
        done
    volumes:
      - ./eventing/connectors:/connectors:ro
    depends_on:
      kafka-connect:
        condition: service_healthy
    restart: "no"
    networks:
      - crm-net

networks:
  crm-net:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
  kafka-data: