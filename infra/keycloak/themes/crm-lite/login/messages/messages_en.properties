# CRM Lite login theme — English (default). Keys prefixed eds* are theme-specific;
# credential/error text (invalid login, disabled user) still comes from Keycloak's
# own localized messages so the non-revealing wording (AC-AUTH-01-03/04/05) is kept.
edsLoginTitle=CRM Lite - Sign in
edsLoginHeading=Sign in
edsLoginSubtitle=Sign in with your organizational account.
edsUsernameLabel=Username
edsPasswordLabel=Password
edsLoginButton=Login
edsShowPassword=Show password
edsHidePassword=Hide password
edsLanguage=Language
edsLoginFooter=© 2026 Etiya. All rights reserved.
edsPasswordPlaceholder=Enter password

# Overrides of stock Keycloak login messages to match the analyst mock wording.
# The single generic credential error keeps the non-revealing behaviour required by
# AC-AUTH-01-03/04/05 (unknown user, passive user and wrong password are identical).
invalidUserMessage=The username or password you entered is incorrect.
missingUsernameMessage=Username is required.
missingPasswordMessage=Password is required.
# AC-AUTH-01-04: a disabled/passive account must be indistinguishable from a wrong
# password. Keycloak's native "Account is disabled" text reveals it, so we force the
# same generic credential message.
accountDisabledMessage=The username or password you entered is incorrect.
