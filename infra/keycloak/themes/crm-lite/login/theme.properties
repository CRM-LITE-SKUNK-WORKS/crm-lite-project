# CRM Lite — Keycloak login theme (FR-AUTH-01 UI; ADR-006 / document-delta.md #6)
#
# Reproduces the analyst "Login v2" mock (Etiya EDS Lite design system) as a
# Keycloak login theme. The login page is Keycloak's by architecture decision
# (ADR-006: credentials only on the Keycloak page, no in-app/Angular login form,
# ROPC disabled). This theme carries the analyst UI on top of that.
#
# Inherits base messages/resources from the stock "keycloak" login theme, but the
# page chrome is fully replaced by a standalone login.ftl, so we do NOT pull in the
# parent stylesheets — our css/login.css is the only stylesheet.
parent=keycloak
import=common/keycloak

# AC-AUTH language requirement — realm i18n is already en+tr, default en.
locales=en,tr

# Loaded by login.ftl via ${url.resourcesPath}/css/login.css (standalone template).
styles=css/login.css
